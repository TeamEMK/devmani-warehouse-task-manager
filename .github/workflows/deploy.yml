# main par push hote hi Hostinger (devmanierp.com) par deploy.
# Chahiye: repo Settings -> Secrets and variables -> Actions me
# HOSTINGER_API_TOKEN naam ka secret (hPanel -> profile -> API se token).
name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hostinger-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Zip banao (git HEAD se)
        run: git archive --format=zip --prefix=devmani-warehouse-task-manager/ -o app.zip HEAD

      - name: Upload + build on Hostinger
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
        run: node scripts/hostinger-deploy.js
